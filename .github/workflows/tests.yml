# Runs the Deno tests (tests/core_test.ts: the cleaning, the figures and the question planner)
# on every push and pull request. Deno resolves the imports and types through node_modules,
# so the npm packages are installed first. No secrets needed.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read --no-lock tests/
